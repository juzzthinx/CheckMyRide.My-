<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <title>CheckMyRide.My</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>

    body {

      margin: 0;

      font-family: Arial, Helvetica, sans-serif;

      background: #FAFAFA;

      color: #111;

    }

    header {

      padding: 15px;

      font-weight: 900;

      letter-spacing: 2px;

      font-size: 20px;

      border-bottom: 1px solid #000;

      display: flex;

      justify-content: space-between;

    }

    button {

      border: 1px solid #000;

      background: transparent;

      padding: 8px 12px;

      cursor: pointer;

    }

    .container {

      padding: 10px;

    }

    .card {

      margin-bottom: 20px;

      border-bottom: 1px solid #000;

      padding-bottom: 10px;

    }

    .card img {

      width: 100%;

      height: 220px;

      object-fit: cover;

    }

    .title {

      font-size: 18px;

      font-weight: bold;

      margin-top: 5px;

    }

    .price {

      font-size: 14px;

    }

    .detail {

      display: none;

      padding: 15px;

    }

    .detail img {

      width: 100%;

      height: 250px;

      object-fit: cover;

    }

    .label {

      font-size: 11px;

      letter-spacing: 2px;

      margin-top: 10px;

    }

    input {

      width: 100%;

      padding: 8px;

      margin: 5px 0;

      border: 1px solid #000;

      background: #fff;

    }

    #form {

      display: none;

      padding: 10px;

      border-bottom: 1px solid #000;

    }

  </style>

</head>

<body>

<header>

  CHECKMYRIDE.MY

  <button onclick="toggleForm()">+ POST</button>

</header>

<div id="form">

  <input id="title" placeholder="Vehicle Title" />

  <input id="price" placeholder="Price (RM)" />

  <input id="image" placeholder="Image URL" />

  <button onclick="addRide()">PUBLISH</button>

</div>

<div class="container" id="feed"></div>

<div class="detail" id="detail"></div>

<script>

  let rides = JSON.parse(localStorage.getItem("rides")) || [];

  function save() {

    localStorage.setItem("rides", JSON.stringify(rides));

  }

  function toggleForm() {

    const f = document.getElementById("form");

    f.style.display = f.style.display === "block" ? "none" : "block";

  }

  function addRide() {

    const title = document.getElementById("title").value;

    const price = document.getElementById("price").value;

    const image = document.getElementById("image").value;

    if (!title || !price || !image) return alert("Fill all fields");

    rides.unshift({ id: Date.now(), title, price, image });

    save();

    render();

    document.getElementById("title").value = "";

    document.getElementById("price").value = "";

    document.getElementById("image").value = "";

  }

  function render() {

    const feed = document.getElementById("feed");

    feed.innerHTML = "";

    rides.forEach(r => {

      const div = document.createElement("div");

      div.className = "card";

      div.innerHTML = `

        <img src="${r.image}" />

        <div class="title">${r.title}</div>

        <div class="price">RM ${r.price}</div>

        <button onclick="viewDetail(${r.id})">VIEW</button>

      `;

      feed.appendChild(div);

    });

  }

  function viewDetail(id) {

    const ride = rides.find(r => r.id === id);

    const d = document.getElementById("detail");

    d.style.display = "block";

    d.innerHTML = `

      <img src="${ride.image}" />

      <h2>${ride.title}</h2>

      <div>— FIELD REPORT —</div>

      <h3>RM ${ride.price}</h3>

      <div class="label">SPECIFICATION</div>

      <p>DATA COMING SOON</p>

      <div class="label">LOCATION</div>

      <p>KUALA LUMPUR</p>

      <button>RENT THIS RIDE</button>

      <button>MESSAGE OWNER</button>

    `;

    window.scrollTo(0, 0);

  }

  render();

</script>

</body>

</html
